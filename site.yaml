      - { titulo: Te damos hora, texto: "En el centro o en tu casa, de mañana o de tarde." }
      - { titulo: Primera sesión, texto: "Valoración y tratamiento desde el primer día." }
    cta: { texto: Escribir por WhatsApp, url: "https://wa.me/34655319024" }
