  opiniones:
    activa: true
    antetitulo: Opiniones
    titulo: Lo que cuentan nuestros pacientes
    imagen: /fotos/opiniones.jpg
    testimonios:
      - { texto: "Llegué con una ciática que no me dejaba ni conducir. En tres semanas estaba otra vez trabajando y con una tabla de ejercicios que sigo haciendo.", autor: Francisco M., nota: "Ciática, Jerez" }
      - { texto: "Me operaron de la rodilla y me acompañaron hasta volver a correr. Explican todo y no te hacen perder el tiempo.", autor: Marta G., nota: "Ligamento cruzado, Guadalcacín" }
      - { texto: "Vienen a casa a tratar a mi madre dos veces por semana. Puntuales, pacientes y ella les espera con ganas.", autor: Inmaculada R., nota: "Fisioterapia a domicilio, Jerez" }

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Antes de tu primera sesión
    texto: "Si te queda alguna duda, llámanos o escríbenos por WhatsApp."
    preguntas:
      - { pregunta: "¿Necesito volante del médico?", respuesta: "No. Puedes pedir cita directamente. Si tienes informes o pruebas de imagen, tráelos a la primera sesión." }
      - { pregunta: "¿Qué ropa llevo a la sesión?", respuesta: "Ropa cómoda con la que puedas moverte. Si el problema es de rodilla o tobillo, mejor un pantalón corto." }
      - { pregunta: "¿Cuántas sesiones voy a necesitar?", respuesta: "Depende de la lesión. En la valoración te damos una estimación y la revisamos cada pocas sesiones." }
      - { pregunta: "¿Trabajáis con seguros y mutuas?", respuesta: "Te damos factura con el número de colegiado para que tu seguro te la reembolse si lo cubre. Pregúntanos por los convenios con mutuas deportivas." }
      - { pregunta: "¿A qué zonas vais a domicilio?", respuesta: "A todo Jerez, Guadalcacín, La Barca, Estella del Marqués y El Puerto de Santa María." }
      - { pregunta: "¿Y si tengo que cancelar?", respuesta: "Avísanos con 24 horas de antelación y cambiamos la cita sin coste." }

  cita:
    activa: true
    antetitulo: Pide cita
    titulo: Tu primera sesión, esta semana
    texto: "Cuéntanos qué te pasa y cuándo te viene bien. Te llamamos en menos de 24 horas laborables para darte hora."
