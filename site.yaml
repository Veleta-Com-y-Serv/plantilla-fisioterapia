    imagen: /fotos/dolencias.jpg
    items:
      - { titulo: Espalda y lumbares, texto: "Lumbalgia, ciática y hernia discal.", icono: columna }
      - { titulo: Cuello y cervicales, texto: "Tensión, mareos y dolor de cabeza.", icono: cabeza }
      - { titulo: Hombro, texto: "Tendinitis y hombro congelado.", icono: brazo }
      - { titulo: Rodilla, texto: "Menisco, ligamentos y dolor al correr.", icono: rodilla }
      - { titulo: Lesiones deportivas, texto: "Esguinces, roturas y sobrecargas.", icono: corredor }
      - { titulo: Pie y tobillo, texto: "Fascitis plantar y esguinces de repetición.", icono: pie }
      - { titulo: Mandíbula, texto: "Bruxismo y dolor al masticar.", icono: cabeza }
      - { titulo: Embarazo y posparto, texto: "Dolor pélvico y suelo pélvico.", icono: corazon }

  proceso:
    activa: true
    antetitulo: Método
    titulo: Cuatro pasos para que no vuelva
    texto: "No nos limitamos a quitar el dolor: buscamos por qué aparece y te enseñamos a evitarlo."
    imagen: /fotos/metodo.jpg
    items:
      - { titulo: Valoración, texto: "Escuchamos tu historia, vemos cómo te mueves y revisamos tus pruebas.", icono: lupa }
      - { titulo: Tratamiento, texto: "Terapia manual, punción seca o ejercicio, según lo que necesites.", icono: mano }
      - { titulo: Ejercicio en casa, texto: "Te llevas una tabla sencilla con vídeos para hacer entre sesiones.", icono: corredor }
      - { titulo: Revisión, texto: "Medimos cómo avanzas y espaciamos las sesiones hasta el alta.", icono: grafico }

