  tratamientos:
    activa: true
    antetitulo: Tratamientos
    titulo: Manos, ejercicio y un plan claro
    texto: "Cada sesión empieza con una valoración y termina con pautas para casa. Te damos factura para tu seguro o mutua."
    imagen: /fotos/tratamientos.jpg
    tratamientos:
      - { nombre: Fisioterapia general, texto: "Dolor de espalda, cuello y hombro, contracturas y sobrecargas. Terapia manual y ejercicio terapéutico.", duracion: "50 min", modalidad: Presencial, precio: "40 €" }
      - { nombre: Osteopatía, texto: "Valoración global y técnicas suaves sobre articulaciones y tejidos para los dolores que vuelven.", duracion: "60 min", modalidad: Presencial, precio: "50 €" }
      - { nombre: Fisioterapia deportiva, texto: "Esguinces, roturas fibrilares y tendinopatías. Readaptación hasta que vuelves a entrenar.", duracion: "50 min", modalidad: Presencial, precio: "45 €" }
      - { nombre: Rehabilitación tras cirugía, texto: "Prótesis de rodilla y cadera, ligamento cruzado y fracturas, de la mano de tu traumatólogo.", duracion: "50 min", modalidad: "Presencial y a domicilio", precio: "40 €" }
      - { nombre: Suelo pélvico, texto: "Embarazo, posparto, incontinencia y dolor pélvico, en una sala privada con fisioterapeuta especializada.", duracion: "50 min", modalidad: Presencial, precio: "50 €" }
      - { nombre: Fisioterapia a domicilio, texto: "Para personas mayores o con movilidad reducida. Llevamos camilla y material.", duracion: "50 min", modalidad: A domicilio, precio: "55 €" }
